name: Deploy demo site

on:
  push:
    branches: [main, web-demo]
    paths:
      - "site/**"
      - "viewer/**"
      - "browser/**"
      - "vendor/spark/**"
      - "vendor/three/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/vendor/brush_wasm_target
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/brush_wasm_target
          key: brush-wasm-v2-${{ runner.os }}-1.97.1-${{ hashFiles('browser/build-brush.sh', 'browser/brush-export.patch') }}
      - run: npm install --global wasm-pack@0.15.0
      - run: npm ci && npm test && npm run build:brush && npm run build
        working-directory: browser
      # Pulls in the shared viewer engine and the vendored libs from the repo
      # root; site/ alone is not a complete page.
      - run: ./site/build.sh
      - run: mkdir -p _site/create && cp -R browser/dist/. _site/create/
      # Cookieless page-view counts; a no-op until the GOATCOUNTER_CODE repo
      # variable is set (Settings -> Secrets and variables -> Actions -> Variables).
      - run: ./site/analytics.sh
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
