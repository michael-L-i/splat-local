name: Pipeline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4
      - run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci
      - run: npm test
      # GPU training and the separate Rust/WASM build are exercised locally.
      - name: Build JavaScript (WASM is tested locally)
        run: SPLAT_JS_ONLY=1 npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test browser UI without GPU training
        run: npm run test:e2e -- --grep 'unsupported browsers|without subgroups|presets, advanced controls'
      - name: Test assembled site navigation (real-GPU rendering runs locally)
        run: npm run test:site
